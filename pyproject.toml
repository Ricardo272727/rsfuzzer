[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsfuzzer"
version = "0.1.0"
description = "API logic and authorization fuzzer scaffold."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "cuana" }
]
dependencies = ["PyYAML"]

[project.scripts]
rsfuzzer = "rsfuzzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
